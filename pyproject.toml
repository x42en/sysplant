[project]
name = "sysplant"
version = "0.5.2"
description = "SysPlant - Your syscall factory"
authors = [
    {name = "Ben Mz", email = "x42en@users.noreply.github.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<4"

[project.optional-dependencies]
# Pin to mcp 1.x: the server uses the v1 FastMCP API, which was removed in mcp 2.x
# (renamed to MCPServer). Do not relax past <2 without porting sysplant/mcp_server.py.
mcp = ["mcp[cli]>=1.0,<2"]

[project.scripts]
sysplant-mcp = "sysplant.mcp_server:main"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
poetry-bumpversion = "^0.3.3"
pytest-cov = "^6.0.0"

[tool.poetry.group.mcp]
optional = true

[tool.poetry.group.mcp.dependencies]
mcp = {version = ">=1.0,<2", extras = ["cli"]}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[[tool.poetry_bumpversion.replacements]]
files = ["__metadata.py"]
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[tool.pytest.ini_options]
# Also see
# https://docs.pytest.org/en/6.2.x/customize.html#pyproject-toml
# https://pytest-cov.readthedocs.io/en/latest/config.html
# If you want to see console output from tests, include -s flag
addopts = [
    '--cov-fail-under=80',
    '--cov-report=html:pytest',
    '--cov-report=term-missing',
    '--junitxml=report.xml'
]

[tool.coverage.run]
# mcp_server.py depends on the optional `mcp` extra; it is not installed in the
# default test environment and cannot be imported there, so it is excluded from
# the coverage gate (measured separately when the `mcp` group is installed).
omit = ["tests", "sysplant/mcp_server.py"]
source = ["sysplant"]
